<style>
:root{
  --ground:#0F1418; --panel:#161D23; --panel-2:#1D262D; --line:#2A353D; --line-soft:#222B32;
  --ink:#E6ECF0; --ink-2:#B7C2CA; --muted:#8A98A3;
  --accent:#E0A24A; --accent-ink:#1A1204; --accent-soft:rgba(224,162,74,.16);
  --blue:#4A8FE0; --stage-top:#141B21; --stage-bot:#07090B;
  --globe:#1A232B; --coast:#5C6E7C; --grat:#243039;
  --op:#4FC98A; --con:#E0A24A; --pre:#4A8FE0; --ann:#8FB4E8; --mot:#B48EDD; --she:#7A8CA0; --ret:#6B7780; --can:#A65A5A;

  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}

    --accent:#B8771F; --accent-ink:#FFFFFF; --accent-soft:rgba(184,119,31,.14);
    --blue:#1F5FA8; --stage-top:#F3F5F7; --stage-bot:#CDD6DC;
    --globe:#DDE4E9; --coast:#7C8C98; --grat:#C5CFD6;
    --op:#1F9A5C; --con:#B8771F; --pre:#1F5FA8; --ann:#5C8CC9; --mot:#7E4FB5; --she:#6A7B8C; --ret:#8A96A0; --can:#B0524E;
    --shadow:0 2px 8px rgba(16,22,27,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#E9EDF0; --panel:#F7F9FA; --panel-2:#EEF2F4; --line:#C9D2D8; --line-soft:#DDE3E7;
  --ink:#10161B; --ink-2:#2F3A42; --muted:#5E6B75;
  --accent:#B8771F; --accent-ink:#FFFFFF; --accent-soft:rgba(184,119,31,.14);
  --blue:#1F5FA8; --stage-top:#F3F5F7; --stage-bot:#CDD6DC;
  --globe:#DDE4E9; --coast:#7C8C98; --grat:#C5CFD6;
  --op:#1F9A5C; --con:#B8771F; --pre:#1F5FA8; --ann:#5C8CC9; --mot:#7E4FB5; --she:#6A7B8C; --ret:#8A96A0; --can:#B0524E;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh;gap:10px;padding:10px}
.head{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:2px 6px 10px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1;display:flex;align-items:baseline;gap:10px}
.head h1 .big{font-size:40px;color:var(--accent);font-variant-numeric:tabular-nums}
.head .sub{color:var(--muted);font-size:12.5px}
.head .sub b{color:var(--ink-2);font-weight:500}
.ctl{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn+.btn{border-left:1px solid var(--line)}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;gap:10px;min-height:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;padding:8px 10px}
.tile .v{font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.tile .k{font-size:11px;color:var(--muted);margin-top:3px}
.tile.kr{border-color:var(--accent);background:var(--accent-soft)}
.tile.kr .v{color:var(--accent)}
.status{background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;padding:6px 4px}
.st{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;background:none;border:0;text-align:left;border-radius:3px}
.st:hover{background:var(--panel-2)}
.st .sw{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.st .sn{flex:1}
.st .sq{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.st[aria-pressed="false"]{opacity:.45}
.st[aria-pressed="false"] .sw{background:transparent;border:1.5px solid var(--c)}
.search{position:relative}
.search input{width:100%;padding:8px 10px 8px 32px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2}
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;background:var(--panel);border:1px solid var(--line-soft);border-radius:4px}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;background:none;border:0;border-bottom:1px solid var(--line-soft);text-align:left;font-size:13px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .rk{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:2ch;text-align:right}
.row .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn small{color:var(--muted);font-size:11.5px;margin-left:4px}
.row .rq{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.row .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);opacity:.5}
.row{position:relative}
.row.kr .rn{color:var(--accent);font-weight:500}
.railfoot{font-size:11px;color:var(--muted);line-height:1.45;padding:0 2px}
.railfoot .credit{display:block;margin-top:4px;color:var(--ink-2)}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,var(--stage-top),var(--stage-bot));border:1px solid var(--line);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
canvas.pick{cursor:pointer}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tools .btn{padding:4px 8px;font-size:12px}
.hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--muted);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-size:12px;box-shadow:var(--shadow);transform:translate(12px,-50%);white-space:nowrap;z-index:3}
.tip b{font-weight:500}
.tip .num{color:var(--muted);margin-left:6px}
.tip[hidden]{display:none}
.legend{position:absolute;left:10px;top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.scale{position:absolute;left:10px;top:34px;display:flex;align-items:flex-end;gap:6px;font-size:11px;color:var(--muted);pointer-events:none}
.scale i{display:inline-block;border-radius:50%;background:var(--muted);opacity:.7}
.stagecredit{position:absolute;right:10px;bottom:10px;font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;opacity:.8}
.info:not([hidden]) ~ .stagecredit{display:none}

/* blocks view */
.blocks{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;padding:44px 14px 14px;background:linear-gradient(var(--stage-top),var(--stage-bot));z-index:1}
.blocks[hidden]{display:none}
.blocks svg{display:block;max-width:100%;height:auto}
.blocks .brow{cursor:pointer}
.blocks .blab{font-family:var(--f-body);font-size:12px;fill:var(--ink-2)}
.blocks .blab.kr{fill:var(--accent);font-weight:500}
.blocks .bq{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.blocks rect.u{stroke:var(--stage-bot);stroke-width:.6}
.blocks rect.u:hover{stroke:var(--ink);stroke-width:1.2}
.blocks .axis{stroke:var(--line);stroke-width:1}
.blocks .axt{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.blocks .bnote{font-size:11.5px;fill:var(--muted)}

/* info card */
.info{position:absolute;right:10px;bottom:10px;width:min(340px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:12px 14px;box-shadow:var(--shadow);z-index:2}
.info[hidden]{display:none}
.info .kg{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.info .ko{margin:2px 0 0;font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.info .en{color:var(--muted);font-size:12.5px;margin-top:2px}
.info .mw{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.info .mw small{font-size:13px;color:var(--muted);font-weight:600}
.info .role{margin:8px 0 0;color:var(--ink-2);font-size:13px;line-height:1.5}
.info .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.info .meta b{color:var(--ink-2);font-weight:500}
.info .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0;background:none;color:var(--muted);border-radius:3px}
.info .x:hover{background:var(--panel-2);color:var(--ink)}
.info .acts{display:flex;gap:6px;margin-top:10px}
.info .acts .btn{padding:4px 9px;font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);padding:8px;gap:8px}
  .head h1{font-size:20px}.head h1 .big{font-size:30px}
  .head .sub{display:none}
  .rail{flex-direction:row;flex-wrap:wrap;gap:6px}
  .tiles{display:none}
  .status{display:flex;flex-wrap:wrap;gap:2px;padding:2px;flex:1 1 100%}
  .st{width:auto;padding:4px 8px;font-size:12px}
  .st .sq{display:none}
  .search{flex:1 1 100%}
  .list{display:none}
  .railfoot{display:none}
  .legend{display:none}
  .scale{top:10px}
  .info .ko{font-size:20px}
}
</style>

,82.2],[-31.4,82.02],[-27.86,82.13],[-24.84,81.79],[-22.9,82.09],[-22.07,81.73],[-23.17,81.15],[-20.62,81.52],[-15.77,81.91],[-12.77,81.72],[-12.21,81.29],[-16.29,80.58],[-16.85,80.35],[-20.05,80.18],[-17.73,80.13],[-18.9,79.4],[-19.7,78.75],[-19.67,77.64],[-18.47,76.99],[-20.04,76.94],[-21.68,76.63],[-19.83,76.1],[-19.6,75.25],[-20.67,75.16],[-19.37,74.3],[-21.59,74.22],[-20.43,73.82],[-20.76,73.46],[-22.17,73.31],[-23.57,73.31],[-22.31,72.63],[-22.3,72.18],[-24.28,72.6],[-24.79,72.33],[-23.44,72.08],[-22.13,71.47],[-21.75,70.66],[-23.54,70.47],[-24.31,70.86],[-25.54,71.43],[-25.2,70.75],[-26.36,70.23],[-23.73,70.18],[-22.35,70.13],[-25.03,69.26],[-27.75,68.47],[-30.67,68.13],[-31.78,68.12],[-32.81,67.74],[-34.2,66.68],[-36.35,65.98],[-37.04,65.94],[-38.38,65.69],[-39.81,65.46],[-40.67,64.84],[-40.68,64.14],[-41.19,63.48],[-42.82,62.68],[-42.42,61.9],[-42.87,61.07],[-43.38,60.1],[-44.79,60.04],[-46.26,60.85],[-48.26,60.86],[-49.23,61.41],[-49.9,62.38],[-51.63,63.63],[-52.14,64.28],[-52.28,65.18],[-53.66,66.1],[-53.3,66.84],[-53.97,67.19],[-52.98,68.36],[-51.48,68.73],[-51.08,69.15],[-50.87,69.93],[-52.01,69.57],[-52.56,69.43],[-53.46,69.28],[-54.68,69.61],[-54.75,70.29],[-54.36,70.82],[-53.43,70.84],[-51.39,70.57],[-53.11,71.2],[-54.0,71.55],[-55,71.41],[-55.83,71.65],[-54.72,72.59],[-55.33,72.96],[-56.12,73.65],[-57.32,74.71],[-58.6,75.1],[-58.59,75.52],[-61.27,76.1],[-63.39,76.18],[-66.06,76.13],[-68.5,76.06],[-69.66,76.38],[-71.4,77.01],[-68.78,77.32],[-66.76,77.38],[-71.04,77.64],[-73.3,78.04],[-73.16,78.43],[-69.37,78.91],[-65.71,79.39],[-65.32,79.76],[-68.02,80.12],[-67.15,80.52],[-63.69,81.21],[-62.23,81.32],[-62.65,81.77],[-60.28,82.03],[-57.21,82.19],[-54.13,82.2],[-53.04,81.89],[-50.39,82.44],[-48.0,82.06],[-46.6,81.99],[-44.52,81.66],[-46.9,82.2],[-46.76,82.63]],[[-106.6,73.6],[-105.26,73.64],[-104.5,73.42],[-105.38,72.76],[-106.94,73.46],[-106.6,73.6]]]};</script>
<script>
(() => {
const D = WORLD, U = D.units, N = U.length;
const ST_ORDER = ['op','con','pre','ann','mot','she','ret','can'];
const state = { on: {op:true, con:true, pre:false, ann:false, mot:true, she:false, ret:true, can:false},
                focus: null, sel: -1, view: 'globe', spin: true };
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString('ko-KR');
const ko = c => D.country[c] || c;
const name = u => (u.pk || u.p) + (u.u ? ' ' + u.u + '호기' : '');
const nameEn = u => u.p + (u.u ? ' ' + u.u : '');
const gw = mw => (mw/1000).toFixed(1);

// ---------- visibility ----------
const vis = new Uint8Array(N);
function recompute(){
  let n=0, sum=0; const byC = new Map();
  for (let i=0;i<N;i++){ const u=U[i]; const v = state.on[u.st] ? 1 : 0; vis[i]=v; if(!v) continue;
    n++; sum+=u.mw; const b = byC.get(u.c) || {n:0, mw:0, la:0, lo:0}; b.n++; b.mw+=u.mw; b.la+=u.la; b.lo+=u.lo; byC.set(u.c,b); }
  state.n=n; state.mw=sum; state.byC=[...byC.entries()].map(([c,b])=>({c,...b,la:b.la/b.n,lo:b.lo/b.n})).sort((a,b)=>b.mw-a.mw);
  $('hN').textContent = fmt(n);
  const parts = ST_ORDER.filter(s=>state.on[s]).map(s=>D.status[s]);
  $('hSub').innerHTML = `<b>${parts.join(' · ')}</b> 기준 · 합계 <b>${fmt(Math.round(sum/1000))} GW</b> · 전체 자료 ${fmt(N)}기`;
  renderStatus(); renderList(); applyGlobe(); if (state.view==='blocks') renderBlocks();
}

// ---------- rail: tiles ----------
(function tiles(){
  const m = D.meta;
  const rank = (()=>{ const t=new Map(); U.forEach(u=>{ if(u.st==='op') t.set(u.c,(t.get(u.c)||0)+u.mw); }); return [...t.entries()].sort((a,b)=>b[1]-a[1]).findIndex(e=>e[0]==='South Korea')+1; })();
  $('tiles').innerHTML = `
   <div class="tile"><div class="v">${fmt(m.op)}<small>기</small></div><div class="k">운전 중 · ${m.op_gw} GW</div></div>
   <div class="tile"><div class="v">${fmt(m.con)}<small>기</small></div><div class="k">건설 중 · ${m.con_gw} GW</div></div>
   <div class="tile"><div class="v">${fmt(m.ret)}<small>기</small></div><div class="k">영구 정지</div></div>
   <div class="tile kr"><div class="v">${m.kr_op}<small>기</small></div><div class="k">한국 운전 중 · ${m.kr_op_gw} GW · 세계 ${rank}위</div></div>`;
  $('fSnap').textContent = m.snapshot;
})();

// ---------- rail: status toggles ----------
const stCount = {}; U.forEach(u=>{ stCount[u.st]=(stCount[u.st]||0)+1; });
function renderStatus(){
  $('status').innerHTML = ST_ORDER.map(s=>`<button class="st" data-s="${s}" aria-pressed="${state.on[s]}" style="--c:var(--${s})"><span class="sw"></span><span class="sn">${D.status[s]}</span><span class="sq">${fmt(stCount[s]||0)}</span></button>`).join('');
  $('legend').innerHTML = ST_ORDER.filter(s=>state.on[s]).map(s=>`<span style="--c:var(--${s})"><i></i>${D.status[s]}</span>`).join('');
}
$('status').addEventListener('click', e=>{ const b=e.target.closest('.st'); if(!b) return; state.on[b.dataset.s]=!state.on[b.dataset.s]; recompute(); });

// ---------- rail: list (countries / search) ----------
function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const L = $('list');
  if (q){
    const hits=[]; for(let i=0;i<N&&hits.length<80;i++){ const u=U[i];
      if ((u.pk&&u.pk.includes(q)) || u.p.toLowerCase().includes(q) || ko(u.c).includes(q) || u.c.toLowerCase().includes(q)) hits.push(i); }
    hits.sort((a,b)=>U[b].mw-U[a].mw);
    L.innerHTML = hits.length ? hits.map(i=>{const u=U[i]; return `<button class="row ${u.c==='South Korea'?'kr':''}" data-i="${i}" aria-pressed="${state.sel===i}"><span class="sw" style="width:8px;height:8px;border-radius:50%;background:var(--${u.st});flex:none"></span><span class="rn">${name(u)}<small>${ko(u.c)} · ${D.status[u.st]}</small></span><span class="rq">${fmt(u.mw)} MW</span></button>`;}).join('')
                             : `<div class="row" style="color:var(--muted)">검색 결과 없음</div>`;
    return;
  }
  const max = state.byC.length ? state.byC[0].mw : 1;
  L.innerHTML = state.byC.map((b,k)=>`<button class="row ${b.c==='South Korea'?'kr':''}" data-c="${b.c}" aria-pressed="${state.focus===b.c}"><span class="rk">${k+1}</span><span class="rn">${ko(b.c)}<small>${b.n}기</small></span><span class="rq">${gw(b.mw)} GW</span><span class="bar" style="width:${(b.mw/max*100).toFixed(1)}%"></span></button>`).join('');
}
$('q').addEventListener('input', renderList);
$('list').addEventListener('click', e=>{ const b=e.target.closest('.row'); if(!b) return;
  if (b.dataset.i!==undefined){ select(+b.dataset.i, true); return; }
  const c=b.dataset.c; if (state.focus===c){ state.focus=null; } else { state.focus=c; const bc=state.byC.find(x=>x.c===c); flyTo(bc.la, bc.lo, c==='United States'||c==='Russia'||c==='China'?3.2:2.4); }
  renderList(); applyGlobe(); if(state.view==='blocks') renderBlocks(); });

// ---------- three.js globe ----------
const canvas = $('c'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100); camera.position.set(0,0,3.6);
const globe = new THREE.Group(); scene.add(globe);
const R = 1;
const sphMat = new THREE.MeshBasicMaterial({color:0x1a232b});
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R, 64, 48), sphMat));
const ll = (la, lo, r=R) => { const a=la*Math.PI/180, b=lo*Math.PI/180; return new THREE.Vector3(r*Math.cos(a)*Math.sin(b), r*Math.sin(a), r*Math.cos(a)*Math.cos(b)); };
// coastline
(function(){ const pos=[]; for (const line of D.coast){ for(let k=0;k<line.length-1;k++){ const a=ll(line[k][1],line[k][0],R*1.002), b=ll(line[k+1][1],line[k+1][0],R*1.002); pos.push(a.x,a.y,a.z,b.x,b.y,b.z); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  globe.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0x5c6e7c})));
  const gp=[]; for(let lo=-180;lo<180;lo+=30){ for(let la=-90;la<90;la+=3){ const a=ll(la,lo,R*1.001), b=ll(la+3,lo,R*1.001); gp.push(a.x,a.y,a.z,b.x,b.y,b.z);} }
  for(let la=-60;la<=60;la+=30){ for(let lo=-180;lo<180;lo+=3){ const a=ll(la,lo,R*1.001), b=ll(la,lo+3,R*1.001); gp.push(a.x,a.y,a.z,b.x,b.y,b.z);} }
  const gg=new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(gp,3));
  globe.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({color:0x243039, transparent:true, opacity:.7})));
})();
// reactor points
const dots = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({}), N);
globe.add(dots);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), C = new THREE.Color();
const base = new Float32Array(N), grow = new Float32Array(N);   // target scale, animated scale
const rad = mw => 0.0045 + 0.010*Math.sqrt(Math.max(mw,30)/1500);
function colorOf(i){ const u=U[i]; let c = css('--'+u.st); if (state.focus && u.c!==state.focus) return C.set(c).lerp(new THREE.Color(css('--globe')), .75).clone(); return C.set(c).clone(); }
function applyGlobe(){
  for (let i=0;i<N;i++){ base[i] = vis[i] ? rad(U[i].mw) * (state.sel===i?1.8:1) : 0; dots.setColorAt(i, state.sel===i ? new THREE.Color(css('--ink')) : colorOf(i)); }
  dots.instanceColor.needsUpdate = true;
}
function placeAll(){
  for (let i=0;i<N;i++){ const u=U[i]; const p=ll(u.la,u.lo,R*1.004); S.setScalar(Math.max(grow[i],1e-4)); M.compose(p,Q,S); dots.setMatrixAt(i,M); }
  dots.instanceMatrix.needsUpdate = true;
}
// theme
function theme(){ sphMat.color.set(css('--globe')); globe.children[1].material.color.set(css('--coast')); globe.children[2].material.color.set(css('--grat')); applyGlobe(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// orbit (custom, no OrbitControls dependency)
const cam = { yaw: -127*Math.PI/180, pitch: 36*Math.PI/180, dist: 3.6, fit: 3.6, userZoom:false, tyaw:null, tpitch:null, tdist:null };
let drag=null, lastMove=0;
canvas.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); cam.tyaw=cam.tpitch=null; });
canvas.addEventListener('pointermove', e=>{
  if (drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy)>2) drag.moved=true;
    cam.yaw += dx*0.005*cam.dist/3; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy*0.005*cam.dist/3)); drag.x=e.clientX; drag.y=e.clientY; lastMove=performance.now(); }
  else hover(e);
});
canvas.addEventListener('pointerup', e=>{ if (drag && !drag.moved) pick(e); drag=null; canvas.classList.remove('drag'); });
canvas.addEventListener('pointercancel', ()=>{ drag=null; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); cam.tdist=null; cam.userZoom=true; cam.dist = Math.max(1.35, Math.min(7, cam.dist * (1 + Math.sign(e.deltaY)*0.12))); lastMove=performance.now(); }, {passive:false});
// pinch
let pinch=null; canvas.addEventListener('touchstart', e=>{ if(e.touches.length===2) pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }, {passive:true});
canvas.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); cam.userZoom=true; cam.dist=Math.max(1.35,Math.min(7,cam.dist*pinch/d)); pinch=d; } }, {passive:true});
function flyTo(la, lo, dist){ cam.tyaw = -lo*Math.PI/180; cam.tpitch = la*Math.PI/180; cam.tdist = dist || cam.dist;
  // shortest yaw path
  const d = ((cam.tyaw - cam.yaw) % (2*Math.PI)); cam.tyaw = cam.yaw + (d > Math.PI ? d - 2*Math.PI : d < -Math.PI ? d + 2*Math.PI : d); lastMove=performance.now(); }

// picking
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function hitAt(e){ const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(dots); for (const h of hits){ if (vis[h.instanceId]) return h.instanceId; } return -1; }
let hoverId=-1;
function hover(e){ const i=hitAt(e); hoverId=i; canvas.classList.toggle('pick', i>=0); const t=$('tip');
  if (i<0){ t.hidden=true; return; } const u=U[i]; const r=stage.getBoundingClientRect();
  t.innerHTML = `<b>${name(u)}</b> <span class="num">${fmt(u.mw)} MW</span><br><span style="color:var(--muted)">${ko(u.c)} · ${D.status[u.st]}</span>`; t.hidden=false;
  t.style.left=(e.clientX-r.left)+'px'; t.style.top=(e.clientY-r.top)+'px'; }
function pick(e){ const i=hitAt(e); if (i>=0) select(i,false); else { state.sel=-1; $('info').hidden=true; applyGlobe(); } }

function select(i, fly){ state.sel=i; const u=U[i];
  $('iKo').textContent = name(u); $('iEn').textContent = nameEn(u) + ' · ' + u.c;
  $('iMw').innerHTML = `${fmt(u.mw)}<small> MW</small>`;
  const yrs = u.st==='op' ? (u.y0?`${u.y0}년부터 운전 중`:'운전 중') : u.st==='ret' ? `${u.y0||'?'}~${u.y1||'?'}년 운전` : u.st==='con' ? (u.y0?`${u.y0}년 준공 예정`:'건설 중') : D.status[u.st];
  $('iRole').textContent = `${ko(u.c)} · ${D.types[u.rt]||u.rt}${u.m&&u.m!=='unknown'?' ('+u.m+')':''} · ${yrs}`;
  $('iMeta').innerHTML = `<span>상태</span><b style="color:var(--${u.st})">${D.status[u.st]}</b><span>노형</span><b>${u.rt} · ${D.types[u.rt]||''}</b><span>용량 비교</span><b>고리 1호기(607 MW)의 ${(u.mw/607).toFixed(1)}배</b><span>위치</span><b>${u.la.toFixed(2)}, ${u.lo.toFixed(2)}${u.acc?'':' (대략)'}</b>`;
  $('iWiki').href = 'https://www.gem.wiki/' + u.w; $('iWiki').style.display = u.w ? '' : 'none';
  $('info').hidden=false; applyGlobe(); renderList();
  if (fly){ setView('globe'); flyTo(u.la,u.lo,1.9); }
}
$('infoX').onclick = ()=>{ state.sel=-1; $('info').hidden=true; applyGlobe(); renderList(); };
$('iGo').onclick = ()=>{ if(state.sel>=0){ setView('globe'); const u=U[state.sel]; flyTo(u.la,u.lo,1.9);} };
$('bKr').onclick = ()=>{ setView('globe'); flyTo(36.2,128.0,1.8); };
$('bReset').onclick = ()=>{ state.focus=null; cam.userZoom=false; flyTo(36,127,cam.fit); renderList(); applyGlobe(); };
$('bSpin').onclick = ()=>{ state.spin=!state.spin; $('bSpin').setAttribute('aria-pressed', state.spin); };

// size scale legend
(function(){ const sc=$('scale'); const px = mw => Math.round(rad(mw)/0.0155*22); sc.innerHTML = [300,1000,1700].map(mw=>`<span><i style="width:${px(mw)}px;height:${px(mw)}px"></i></span><span>${mw} MW</span>`).join(''); })();

// resize / loop
function resize(){ const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  cam.fit = Math.max(3.6, 1.12/(Math.tan(camera.fov*Math.PI/360)*camera.aspect)); if (!cam.userZoom && cam.tdist===null) cam.dist = cam.fit; }
new ResizeObserver(resize).observe(stage); resize();
const t0 = performance.now(); let last=t0;
function loop(t){ requestAnimationFrame(loop); const dt=Math.min(.05,(t-last)/1000); last=t;
  // intro: dots grow in staggered
  let dirty=false; const age=(t-t0)/1000;
  for (let i=0;i<N;i++){ const tgt=base[i]; const a = Math.max(0, Math.min(1, (age - i/N*1.6)/0.35)); const want = tgt*a; if (Math.abs(grow[i]-want)>1e-5){ grow[i] += (want-grow[i])*Math.min(1,dt*10); dirty=true; } }
  if (dirty || age<2.2) placeAll();
  if (cam.tyaw!==null){ cam.yaw += (cam.tyaw-cam.yaw)*Math.min(1,dt*4); cam.pitch += (cam.tpitch-cam.pitch)*Math.min(1,dt*4); if (Math.abs(cam.tyaw-cam.yaw)<1e-3 && Math.abs(cam.tpitch-cam.pitch)<1e-3){ cam.tyaw=cam.tpitch=null; } }
  if (cam.tdist!==null){ cam.dist += (cam.tdist-cam.dist)*Math.min(1,dt*4); if (Math.abs(cam.tdist-cam.dist)<1e-3) cam.tdist=null; }
  if (state.spin && !drag && cam.tyaw===null && t-lastMove>2500 && state.view==='globe') cam.yaw += dt*0.08;
  globe.rotation.set(cam.pitch, cam.yaw, 0); camera.position.z = cam.dist;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// ---------- blocks view ----------
function setView(v){ state.view=v; $('vGlobe').setAttribute('aria-pressed', v==='globe'); $('vBlocks').setAttribute('aria-pressed', v==='blocks');
  $('blocks').hidden = v!=='blocks'; $('legend').hidden = v!=='globe'; $('scale').hidden = v!=='globe'; $('bReset').hidden = v!=='globe'; document.querySelector('.hint').hidden = v!=='globe';
  if (v==='blocks') renderBlocks(); }
$('vGlobe').onclick=()=>setView('globe'); $('vBlocks').onclick=()=>setView('blocks');
function renderBlocks(){
  const B=$('blocks'); const W=Math.max(360, stage.clientWidth-28-14); const labW = W<560?96:150, rowH=W<560?16:20, gap=6, top=16;
  const rows=state.byC; const max=rows.length?rows[0].mw:1; const k=(W-labW-130)/max;
  const H = top + rows.length*(rowH+gap) + 30;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="국가별 원전 용량, 원자로 1기가 사각형 하나">`;
  // axis
  const step = max>50000?25000:max>20000?10000:5000;
  for(let g=0; g<=max; g+=step){ const x=labW+g*k; s+=`<line class="axis" x1="${x}" y1="${top-4}" x2="${x}" y2="${H-28}"/><text class="axt" x="${x+3}" y="${H-16}">${g/1000} GW</text>`; }
  rows.forEach((b,r)=>{ const y=top+r*(rowH+gap); const kr=b.c==='South Korea';
    s+=`<g class="brow" data-c="${b.c}"><text class="blab ${kr?'kr':''}" x="${labW-8}" y="${y+rowH*0.72}" text-anchor="end">${ko(b.c)}</text>`;
    let x=labW; const us=[]; for(let i=0;i<N;i++) if(vis[i]&&U[i].c===b.c) us.push(i); us.sort((a,c)=>U[c].mw-U[a].mw);
    for (const i of us){ const w=Math.max(1.2, U[i].mw*k); const dim = state.focus && state.focus!==b.c;
      s+=`<rect class="u" data-i="${i}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${rowH}" fill="var(--${U[i].st})" opacity="${dim?.25:state.sel===i?1:.9}"${state.sel===i?' stroke="var(--ink)" stroke-width="1.5"':''}/>`; x+=w; }
    s+=`<text class="bq" x="${x+6}" y="${y+rowH*0.72}">${b.n}기 · ${gw(b.mw)} GW</text></g>`; });
  s+=`<text class="bnote" x="${labW}" y="${H-2}">사각형 하나 = 원자로 1기, 폭 = 발전용량. 큰 순서로 정렬.</text></svg>`;
  B.innerHTML=s;
}
$('blocks').addEventListener('click', e=>{ const r=e.target.closest('rect.u'); if(r){ select(+r.dataset.i,false); renderBlocks(); return; } const g=e.target.closest('.brow'); if(g){ state.focus = state.focus===g.dataset.c?null:g.dataset.c; renderList(); applyGlobe(); renderBlocks(); } });
$('blocks').addEventListener('pointermove', e=>{ const r=e.target.closest('rect.u'); const t=$('tip'); if(!r){ t.hidden=true; return; } const u=U[+r.dataset.i]; const rc=stage.getBoundingClientRect();
  t.innerHTML=`<b>${name(u)}</b> <span class="num">${fmt(u.mw)} MW</span><br><span style="color:var(--muted)">${ko(u.c)} · ${D.status[u.st]}</span>`; t.hidden=false; t.style.left=(e.clientX-rc.left)+'px'; t.style.top=(e.clientY-rc.top)+'px'; });
$('blocks').addEventListener('pointerleave', ()=>{ $('tip').hidden=true; });
let rbT=null; addEventListener('resize', ()=>{ clearTimeout(rbT); rbT=setTimeout(()=>{ if(state.view==='blocks') renderBlocks(); }, 150); });

// ---------- go ----------
theme(); recompute(); placeAll();
})();
</script>
